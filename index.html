<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spacetime</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
      background: #ffffff;
      color: #111111;
    }
    .wrap {
      padding: 2rem;
      text-align: center;
    }
    p {
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      margin: 0;
    }
    .brand {
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }
    .email {
      margin-top: 0.75rem;
      opacity: 0.6;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0b0b0f;
        color: #e8e8ec;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand">Spacetime</p>
    <p>Probabilistic Machine Learning Lab</p>
    <p class="email"><a href="mailto:hi@spacetimetechnologies.com">hi@spacetimetechnologies.com</a></p>
  </div>
</body>
</html>

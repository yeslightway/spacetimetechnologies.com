<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spacetime</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg1: #e9e9ec;
      --bg2: #ffffff;
      --text: #1d1d1f;
      --muted: rgba(0, 0, 0, 0.55);
      --vignette: rgba(0, 0, 0, 0.02);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #1d1d1f;
        --bg2: #000000;
        --text: #f5f5f7;
        --muted: rgba(255, 255, 255, 0.5);
        --vignette: rgba(255, 255, 255, 0.03);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 0%, var(--vignette) 100%);
      pointer-events: none;
    }
    .wrap {
      text-align: center;
      padding: 24px;
    }
    .brand {
      font-size: 1.0625rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .tagline {
      margin-top: 6px;
      font-size: 0.8125rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    @media (min-width: 768px) {
      .brand { font-size: 1.1875rem; }
      .tagline { font-size: 0.875rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand">Spacetime</p>
    <p class="tagline">Probabilistic Machine Learning Lab</p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spacetime</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --headline: #1d1d1f;
      --subtext: #6e6e73;
      --link: #0066cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --headline: #f5f5f7;
        --subtext: #86868b;
        --link: #2997ff;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--headline);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap {
      padding: 2rem;
      text-align: center;
    }
    .brand {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .tagline {
      font-size: 1.0625rem;
      font-weight: 400;
      line-height: 1.4;
      color: var(--subtext);
      margin: 0.35rem 0 0;
    }
    .cta {
      margin: 1.5rem 0 0;
    }
    .cta a {
      display: inline-block;
      background: #0071e3;
      color: #ffffff;
      font-size: 1.0625rem;
      font-weight: 400;
      line-height: 1.2;
      padding: 0.55rem 1.25rem;
      border-radius: 980px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .cta a:hover {
      background: #0077ed;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand">Spacetime</p>
    <p class="tagline">Probabilistic Machine Learning Lab</p>
    <p class="cta"><a href="mailto:hi@spacetimetechnologies.com">Contact</a></p>
  </div>
</body>
</html>
